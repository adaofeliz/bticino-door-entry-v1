[project]
name = "bticino_v1"
version = "1.0.0"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade (modernize syntax)
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "T20",    # flake8-print (no print statements)
    "G",      # flake8-logging-format (lazy logging)
    "LOG",    # flake8-logging
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (formatter handles it)
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.bticino_v1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B404"]  # assert is fine in HA integrations; subprocess used for curl auth

[tool.coverage.run]
source = ["custom_components/bticino_v1"]
omit = ["tests/*"]
